# A thin second profession bundle, for tests only (never shipped): it proves
# the bundle contract carries a new profession with no change to the core or
# the capability services. Mounted into the test stack's registry by
# docker-compose.test.yml; every section of contract v1 is used once.
key: legal-practice
namespace: law
version: 1.0.0
contract: 1
name: Legal Practice
description: Clients, matters per calendar year, hearing deadlines, engagement letters and court portal logins for a small law firm (test fixture).

requires:
  capabilities: [engagements, obligations, documents, vault]

vocabulary:
  client: { one: Client, many: Clients }
  engagement: { one: Matter, many: Matters }
  period: { one: Year, many: Years }
  obligation: { one: Deadline, many: Deadlines }
  document: { one: Letter, many: Letters }

profiles:
  client: { version: 1, schema: schemas/client.json }
  engagement:
    matter: { version: 1, schema: schemas/engagement-matter.json }

identifiers:
  - { type: pan, label: PAN, pattern: "^[A-Z]{5}[0-9]{4}[A-Z]$", unique: true }

peopleRoles:
  - { key: contact, label: Contact person }

engagementTypes:
  - key: matter
    name: Matter
    periodKind: calendar_year
    stages:
      - { key: opened, label: Opened }
      - { key: hearing, label: Hearing }
      - { key: closed, label: Closed }

pipeline:
  - { key: enquiry, label: Enquiries, status: New }
  - { key: consult, label: Consultation, status: In Discussion }

catalog: catalog.yaml
obligations: rules/
documents: documents/
dashboard: cards.yaml

permissions:
  - { code: law.brief.manage, name: Manage briefs, description: Prepare and update case briefs }

roles: roles.yaml
email: email/
help: knowledge/

vault:
  consentFileCategory: vakalatnama_signed
  portals: portals.yaml
