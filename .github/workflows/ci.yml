name: CI

# The whole platform: every repository's unit tests, the migration and gateway
# checks, then the integration suite against the full stack.
#
# Each submodule also runs its own unit tests on its own pushes; this workflow
# is where they are proven to work together, at the pinned commits.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit (${{ matrix.repo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - lead-service
          - customer-service
          - service-service
          - dashboard-service
          - email-service
          - identity-service
          - assistant-service
          - frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
        working-directory: ${{ matrix.repo }}

      - run: npm test
        working-directory: ${{ matrix.repo }}

  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: migrations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      MIGRATIONS_TEST_DB: migrations_test

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
        working-directory: migrations

      - run: npm test
        working-directory: migrations

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: kong config parse
        run: >-
          docker run --rm -e KONG_DATABASE=off -v "$PWD/kong":/kong:ro kong:3.9
          kong config parse /kong/kong.yml

  integration:
    needs: [unit, migrations, gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Boots the stack as a throwaway `cmtest` project against a scripted
      # stand-in for OpenRouter: no real model, no credits, no secrets.
      - run: tests/run-integration.sh
