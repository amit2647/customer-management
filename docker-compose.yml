services:
  postgres:
    image: postgres:16-alpine
    container_name: customer-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_management
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d customer_management"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: customer-management-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  service-service:
    build:
      context: ./service-service
    container_name: customer-management-service-service
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: customer_management
      DB_USER: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: omnicore-development-secret-change-this
      JWT_ISSUER: omnicore-identity-service
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:4003/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  customer-service:
    build:
      context: ./customer-service
    container_name: customer-management-customer-service
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: customer_management
      DB_USER: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: omnicore-development-secret-change-this
      JWT_ISSUER: omnicore-identity-service
      SERVICE_SERVICE_URL: http://service-service:4003
    depends_on:
      postgres:
        condition: service_healthy
      service-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:4002/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  lead-service:
    build:
      context: ./lead-service
    container_name: customer-management-lead-service
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: customer_management
      DB_USER: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: omnicore-development-secret-change-this
      JWT_ISSUER: omnicore-identity-service
      CUSTOMER_SERVICE_URL: http://customer-service:4002
      SERVICE_SERVICE_URL: http://service-service:4003
    depends_on:
      postgres:
        condition: service_healthy
      service-service:
        condition: service_healthy
      customer-service:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:4001/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  identity-service:
    build:
      context: ./identity-service
    container_name: customer-management-identity-service
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: customer_management
      DB_USER: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: omnicore-development-secret-change-this
      JWT_ISSUER: omnicore-identity-service
      JWT_EXPIRES_IN: 8h
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:4004/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  dashboard-service:
    build:
      context: ./dashboard-service
    container_name: customer-management-dashboard-service
    ports:
      - "4005:4005"
    environment:
      PORT: 4005

      JWT_SECRET: omnicore-development-secret-change-this
      JWT_ISSUER: omnicore-identity-service

      LEAD_SERVICE_URL: http://lead-service:4001
      CUSTOMER_SERVICE_URL: http://customer-service:4002
      SERVICE_SERVICE_URL: http://service-service:4003

      REDIS_URL: redis://redis:6379

    depends_on:
      redis:
        condition: service_healthy
      lead-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      service-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:4005/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  email-service:
    build:
      context: ./email-service
    container_name: customer-management-email-service
    restart: unless-stopped

    ports:
      - "4006:4006"

    environment:
      PORT: 4006

      # PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: customer_management
      DB_USER: app_user
      DB_PASSWORD: app_password

      # JWT
      JWT_SECRET: omnicore-development-secret-change-this
      JWT_ISSUER: omnicore-identity-service

      # Redis
      REDIS_URL: redis://redis:6379

      CUSTOMER_SERVICE_URL: http://customer-service:4002
      LEAD_SERVICE_URL: http://lead-service:4001

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:4006/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kong:
    image: kong:3.9
    container_name: customer-management-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8080:8000"
    depends_on:
      lead-service:
        condition: service_started
      customer-service:
        condition: service_started
      service-service:
        condition: service_healthy
      identity-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: customer-management-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      kong:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
