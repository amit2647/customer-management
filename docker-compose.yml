# Every value here comes from .env. The `:-` defaults are what the MVP has
# always used, so the stack still boots on a fresh clone with no .env at all;
# copy .env.example to .env to take control of any of them.
#
# Two things do NOT come from interpolation, deliberately:
#
#   - The OpenRouter settings, which assistant-service reads through env_file.
#     `${VAR}` interpolation prefers a shell export over .env, which is exactly
#     what we were asked to stop.
#   - The internal service ports are also written into kong/kong.yml, which is a
#     separate submodule and is not templated. Changing a *_SERVICE_PORT here
#     means editing kong.yml to match, or the gateway will route to a dead port.

services:
  postgres:
    image: postgres:16-alpine
    container_name: customer-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:-customer_management}"
      POSTGRES_USER: "${DB_USER:-app_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-app_password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-customer_management}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: customer-management-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  # Vector search for the assistant: a derived index of conversation text and
  # the product-help docs. Postgres stays the source of truth, so this volume is
  # rebuildable and needs no backup.
  #
  # No published port: only assistant-service talks to it, over the Docker
  # network. The API key is still set, because without one any container on
  # that network could read every conversation's vectors.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: customer-management-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-}"
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has bash but no curl or wget. /readyz needs no API key.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object store for client files (vault-service only).
  # SeaweedFS, because MinIO's community edition was discontinued in 2026.
  # "mini" runs master, volume, filer and S3 in one container and creates the
  # bucket on start. No host port: only vault-service talks to it.
  #
  # The keys always have a value. With none, SeaweedFS would serve the store
  # anonymously; the defaults are development-only, like HYDRA_SECRETS_SYSTEM's.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: customer-management-seaweedfs
    restart: unless-stopped
    command: ["mini"]
    environment:
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY:-omnicore-dev}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:-omnicore-development-s3-secret-change-this}"
      S3_BUCKET: "${S3_BUCKET:-client-files}"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./migrations
    container_name: customer-management-migrate
    # Must not inherit a restart policy: this container is expected to exit 0.
    restart: "no"
    environment:
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      BOOTSTRAP_ORG_NAME: "${BOOTSTRAP_ORG_NAME:-Acme Corporation}"
      BOOTSTRAP_ORG_SLUG: "${BOOTSTRAP_ORG_SLUG:-acme-corporation}"
      BOOTSTRAP_ADMIN_NAME: "${BOOTSTRAP_ADMIN_NAME:-Admin}"
      # No defaults: with neither set, a new install is set up in the browser
      # with a one-time code printed to this container's log (seed.js).
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-http://localhost:3000}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
      # Hydra's own database and role, created before the ledger (hydra.js).
      HYDRA_DB_NAME: "${HYDRA_DB_NAME:-hydra}"
      HYDRA_DB_USER: "${HYDRA_DB_USER:-hydra}"
      HYDRA_DB_PASSWORD: "${HYDRA_DB_PASSWORD:-hydra_development_password}"
    depends_on:
      postgres:
        condition: service_healthy

  # Ory Hydra (Apache-2.0): OAuth 2.1 / OpenID Connect tokens, signing keys
  # and sessions. Auth-hardening P0: it runs, but nothing signs in through it
  # yet; P1 moves login onto it. It has no login screen or user table of its
  # own - it sends the browser to ours, and identity-service says who the user
  # is.
  #
  # Its database and role are created by `migrate` (migrations/hydra.js);
  # `hydra-migrate` then creates Hydra's own tables, idempotently.
  hydra-migrate:
    image: oryd/hydra:v26.2.0
    container_name: customer-management-hydra-migrate
    restart: "no"
    command: migrate sql -e --yes
    environment:
      DSN: "postgres://${HYDRA_DB_USER:-hydra}:${HYDRA_DB_PASSWORD:-hydra_development_password}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${HYDRA_DB_NAME:-hydra}?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Public API (4444) is reached only through Kong: /oauth2/*, /.well-known/*,
  # /userinfo. The admin API (4445) can create clients and accept logins, so
  # it is never published and never routed; only identity-service calls it,
  # on the Docker network.
  hydra:
    image: oryd/hydra:v26.2.0
    container_name: customer-management-hydra
    restart: unless-stopped
    # --dev allows the plain-http issuer and redirect URLs of a local stack.
    # A deployment behind HTTPS sets HYDRA_SERVE_FLAGS to empty.
    command: serve all -c /etc/config/hydra/hydra.yml ${HYDRA_SERVE_FLAGS---dev}
    environment:
      DSN: "postgres://${HYDRA_DB_USER:-hydra}:${HYDRA_DB_PASSWORD:-hydra_development_password}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${HYDRA_DB_NAME:-hydra}?sslmode=disable"
      # Encrypts Hydra's data at rest. Like every secret here, a development default
      # keeps a fresh clone booting; a real deployment sets its own.
      SECRETS_SYSTEM: "${HYDRA_SECRETS_SYSTEM:-omnicore-development-hydra-secret-change-this}"
      # The public URL, through Kong. Tokens carry it as `iss`.
      URLS_SELF_ISSUER: "http://localhost:${KONG_HOST_PORT:-8080}/"
      # P1: our login page (the frontend) and identity-service's consent route.
      # Nothing sends anyone here yet, so they may 404 until then.
      URLS_LOGIN: "${PUBLIC_APP_URL:-http://localhost:3000}/login"
      URLS_CONSENT: "http://localhost:${KONG_HOST_PORT:-8080}/api/auth/consent"
      URLS_LOGOUT: "http://localhost:${KONG_HOST_PORT:-8080}/api/auth/logout"
      # Signed JWT access tokens (verified per request against Hydra's JWKS in P1).
      STRATEGIES_ACCESS_TOKEN: "jwt"
      TTL_ACCESS_TOKEN: "${HYDRA_TTL_ACCESS_TOKEN:-5m}"
      TTL_REFRESH_TOKEN: "${HYDRA_TTL_REFRESH_TOKEN:-720h}"
      # The token hook (declared in hydra.yml): identity-service rebuilds the
      # claims on every refresh. Its URL and shared secret come from here.
      OAUTH2_TOKEN_HOOK_URL: "http://identity-service:${IDENTITY_SERVICE_PORT:-4004}/internal/token-hook"
      OAUTH2_TOKEN_HOOK_AUTH_CONFIG_VALUE: "${TOKEN_HOOK_SECRET:-omnicore-development-token-hook-secret-change-this}"
      # No anonymous usage reporting to Ory.
      SQA_OPT_OUT: "true"
    # Policy that is the same everywhere (PKCE, later the token hook and the
    # top-level claims). See the file for why those are not env vars.
    volumes:
      - ./hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4444/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  service-service:
    build:
      context: ./service-service
    container_name: customer-management-service-service
    ports:
      - "${SERVICE_SERVICE_HOST_PORT:-4003}:${SERVICE_SERVICE_PORT:-4003}"
    environment:
      PORT: "${SERVICE_SERVICE_PORT:-4003}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      # Hydra's RS256 tokens, the only kind accepted: its keys and issuer.
      HYDRA_JWKS_URL: "http://hydra:4444/.well-known/jwks.json"
      HYDRA_ISSUER: "http://localhost:${KONG_HOST_PORT:-8080}/"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${SERVICE_SERVICE_PORT:-4003}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  customer-service:
    build:
      context: ./customer-service
    container_name: customer-management-customer-service
    ports:
      - "${CUSTOMER_SERVICE_HOST_PORT:-4002}:${CUSTOMER_SERVICE_PORT:-4002}"
    environment:
      PORT: "${CUSTOMER_SERVICE_PORT:-4002}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      # Hydra's RS256 tokens, the only kind accepted: its keys and issuer.
      HYDRA_JWKS_URL: "http://hydra:4444/.well-known/jwks.json"
      HYDRA_ISSUER: "http://localhost:${KONG_HOST_PORT:-8080}/"
      SERVICE_SERVICE_URL: "http://service-service:${SERVICE_SERVICE_PORT:-4003}"
      EMAIL_SERVICE_URL: "http://email-service:${EMAIL_SERVICE_PORT:-4006}"
      # The installed profession bundle's schemas and rules.
      BUNDLE_SERVICE_URL: "http://bundle-service:${BUNDLE_SERVICE_PORT:-4008}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      service-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${CUSTOMER_SERVICE_PORT:-4002}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  lead-service:
    build:
      context: ./lead-service
    container_name: customer-management-lead-service
    ports:
      - "${LEAD_SERVICE_HOST_PORT:-4001}:${LEAD_SERVICE_PORT:-4001}"
    environment:
      PORT: "${LEAD_SERVICE_PORT:-4001}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      # Hydra's RS256 tokens, the only kind accepted: its keys and issuer.
      HYDRA_JWKS_URL: "http://hydra:4444/.well-known/jwks.json"
      HYDRA_ISSUER: "http://localhost:${KONG_HOST_PORT:-8080}/"
      CUSTOMER_SERVICE_URL: "http://customer-service:${CUSTOMER_SERVICE_PORT:-4002}"
      SERVICE_SERVICE_URL: "http://service-service:${SERVICE_SERVICE_PORT:-4003}"
      EMAIL_SERVICE_URL: "http://email-service:${EMAIL_SERVICE_PORT:-4006}"
      # The installed profession bundle's schemas and rules.
      BUNDLE_SERVICE_URL: "http://bundle-service:${BUNDLE_SERVICE_PORT:-4008}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      service-service:
        condition: service_healthy
      customer-service:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${LEAD_SERVICE_PORT:-4001}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  identity-service:
    build:
      context: ./identity-service
    container_name: customer-management-identity-service
    ports:
      - "${IDENTITY_SERVICE_HOST_PORT:-4004}:${IDENTITY_SERVICE_PORT:-4004}"
    environment:
      PORT: "${IDENTITY_SERVICE_PORT:-4004}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      # Hydra's RS256 tokens, the only kind accepted: its keys and issuer.
      HYDRA_JWKS_URL: "http://hydra:4444/.well-known/jwks.json"
      HYDRA_ISSUER: "http://localhost:${KONG_HOST_PORT:-8080}/"
      # The installed profession bundle's firm and professional fields.
      BUNDLE_SERVICE_URL: "http://bundle-service:${BUNDLE_SERVICE_PORT:-4008}"
      # The profession bundle first-run setup installs (empty: the plain CRM).
      SETUP_BUNDLE: "${SETUP_BUNDLE:-ca-practice}"
      # Its own OAuth client in Hydra, upserted on boot through the admin API
      # (src/services/oauthClient.js). Only this service holds the client
      # secret or reaches the admin API.
      HYDRA_ADMIN_URL: "http://hydra:4445"
      OAUTH_CLIENT_ID: "${OAUTH_CLIENT_ID:-omnicore-web}"
      OAUTH_CLIENT_SECRET: "${OAUTH_CLIENT_SECRET:-omnicore-development-oauth-secret-change-this}"
      OAUTH_REDIRECT_URI: "http://localhost:${KONG_HOST_PORT:-8080}/api/auth/callback"
      # Sign-in through Hydra: the token and revoke endpoints (internal), the
      # app to return to, and the refresh cookie. Secure needs HTTPS, so it is
      # off for the plain-http local stack.
      HYDRA_PUBLIC_URL: "http://hydra:4444"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-http://localhost:3000}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      HYDRA_TTL_REFRESH_TOKEN: "${HYDRA_TTL_REFRESH_TOKEN:-720h}"
      # Hydra's token hook presents this; only Hydra and this service hold it.
      TOKEN_HOOK_SECRET: "${TOKEN_HOOK_SECRET:-omnicore-development-token-hook-secret-change-this}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${IDENTITY_SERVICE_PORT:-4004}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  dashboard-service:
    build:
      context: ./dashboard-service
    container_name: customer-management-dashboard-service
    ports:
      - "${DASHBOARD_SERVICE_HOST_PORT:-4005}:${DASHBOARD_SERVICE_PORT:-4005}"
    environment:
      PORT: "${DASHBOARD_SERVICE_PORT:-4005}"

      # Needed only to read active access grants when authenticating a request.
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"

      # Hydra's RS256 tokens, the only kind accepted: its keys and issuer.
      HYDRA_JWKS_URL: "http://hydra:4444/.well-known/jwks.json"
      HYDRA_ISSUER: "http://localhost:${KONG_HOST_PORT:-8080}/"

      LEAD_SERVICE_URL: "http://lead-service:${LEAD_SERVICE_PORT:-4001}"
      CUSTOMER_SERVICE_URL: "http://customer-service:${CUSTOMER_SERVICE_PORT:-4002}"
      SERVICE_SERVICE_URL: "http://service-service:${SERVICE_SERVICE_PORT:-4003}"
      BUNDLE_SERVICE_URL: "http://bundle-service:${BUNDLE_SERVICE_PORT:-4008}"
      OBLIGATION_SERVICE_URL: "http://obligation-service:${OBLIGATION_SERVICE_PORT:-4010}"

      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lead-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      service-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${DASHBOARD_SERVICE_PORT:-4005}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  email-service:
    build:
      context: ./email-service
    container_name: customer-management-email-service
    restart: unless-stopped

    ports:
      - "${EMAIL_SERVICE_HOST_PORT:-4006}:${EMAIL_SERVICE_PORT:-4006}"

    environment:
      PORT: "${EMAIL_SERVICE_PORT:-4006}"

      # PostgreSQL
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"

      # JWT
      # Hydra's RS256 tokens, the only kind accepted: its keys and issuer.
      HYDRA_JWKS_URL: "http://hydra:4444/.well-known/jwks.json"
      HYDRA_ISSUER: "http://localhost:${KONG_HOST_PORT:-8080}/"
      # Accepted on the automation trigger route only, from background services.
      SERVICE_JWT_SECRET: "${SERVICE_JWT_SECRET:-omnicore-development-service-secret-change-this}"

      # Redis
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"

      CUSTOMER_SERVICE_URL: "http://customer-service:${CUSTOMER_SERVICE_PORT:-4002}"
      LEAD_SERVICE_URL: "http://lead-service:${LEAD_SERVICE_PORT:-4001}"

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${EMAIL_SERVICE_PORT:-4006}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  assistant-service:
    build:
      context: ./assistant-service
    container_name: customer-management-assistant-service
    restart: unless-stopped

    ports:
      - "${ASSISTANT_SERVICE_HOST_PORT:-4007}:${ASSISTANT_SERVICE_PORT:-4007}"

    # The OpenRouter settings come from .env and ONLY from .env.
    #
    # They are not listed under `environment:` below, because `${VAR}`
    # interpolation prefers a value exported in the shell, which silently beat
    # the file and left the real source of the key ambiguous. env_file is read
    # straight off disk and never consults the shell.
    #
    # env_file loads the whole file, so everything else .env defines also lands
    # in this container. The bootstrap values are blanked below for that reason.
    env_file:
      - path: .env
        required: false

    environment:
      PORT: "${ASSISTANT_SERVICE_PORT:-4007}"

      # Only used to read active just-in-time grants when authenticating.
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"

      # Hydra's RS256 tokens, the only kind accepted: its keys and issuer.
      HYDRA_JWKS_URL: "http://hydra:4444/.well-known/jwks.json"
      HYDRA_ISSUER: "http://localhost:${KONG_HOST_PORT:-8080}/"

      # Every tool is a call onto one of these, made with the signed-in user's
      # own token, so each service applies its usual permission checks.
      LEAD_SERVICE_URL: "http://lead-service:${LEAD_SERVICE_PORT:-4001}"
      CUSTOMER_SERVICE_URL: "http://customer-service:${CUSTOMER_SERVICE_PORT:-4002}"
      SERVICE_SERVICE_URL: "http://service-service:${SERVICE_SERVICE_PORT:-4003}"
      DASHBOARD_SERVICE_URL: "http://dashboard-service:${DASHBOARD_SERVICE_PORT:-4005}"
      EMAIL_SERVICE_URL: "http://email-service:${EMAIL_SERVICE_PORT:-4006}"
      IDENTITY_SERVICE_URL: "http://identity-service:${IDENTITY_SERVICE_PORT:-4004}"
      ENGAGEMENT_SERVICE_URL: "http://engagement-service:${ENGAGEMENT_SERVICE_PORT:-4009}"
      OBLIGATION_SERVICE_URL: "http://obligation-service:${OBLIGATION_SERVICE_PORT:-4010}"
      DOCUMENT_SERVICE_URL: "http://document-service:${DOCUMENT_SERVICE_PORT:-4011}"
      BUNDLE_SERVICE_URL: "http://bundle-service:${BUNDLE_SERVICE_PORT:-4008}"

      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-http://localhost:3000}"

      # Listed here rather than left to env_file, so this container and the
      # qdrant container resolve the key the same way — through interpolation.
      # Otherwise a shell export would reach Qdrant but not this service, and
      # every request would be refused.
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"

      # `environment:` overrides env_file, so these blank out the seed
      # credentials this service has no use for. Without them, the one service
      # that talks to an external model would also be holding the bootstrap
      # admin password in its environment.
      BOOTSTRAP_ADMIN_PASSWORD: ""
      BOOTSTRAP_ADMIN_EMAIL: ""
      BOOTSTRAP_ADMIN_NAME: ""

      # Likewise the vault's master key and the object store's keys: only
      # vault-service may hold them, and never the service that talks to a model.
      VAULT_MASTER_KEY: ""
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      SERVICE_JWT_SECRET: ""
      # Hydra's secrets: Hydra and migrate (database), identity-service (client,
      # token hook).
      HYDRA_SECRETS_SYSTEM: ""
      HYDRA_DB_PASSWORD: ""
      OAUTH_CLIENT_SECRET: ""
      TOKEN_HOOK_SECRET: ""
      BOOTSTRAP_ORG_NAME: ""
      BOOTSTRAP_ORG_SLUG: ""

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      lead-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    healthcheck:
      # Node rather than wget: the image is Debian slim (the embedding runtime
      # needs glibc), which does not ship wget.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:' + (process.env.PORT || 4007) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------
  # Profession-bundle capability services (milestone M0: /health only).
  # Ports 4008-4012 are pinned in kong/kong.yml, like the core services'.
  # ---------------------------------------------------------------------

  bundle-service:
    build:
      context: ./bundle-service
      # The bundles it offers are baked into the image from bundles/ (the
      # registry) — a tenant can never upload one.
      additional_contexts:
        bundles: ./bundles
    container_name: customer-management-bundle-service
    ports:
      - "${BUNDLE_SERVICE_HOST_PORT:-4008}:${BUNDLE_SERVICE_PORT:-4008}"
    environment:
      PORT: "${BUNDLE_SERVICE_PORT:-4008}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      # Hydra's RS256 tokens, the only kind accepted: its keys and issuer.
      HYDRA_JWKS_URL: "http://hydra:4444/.well-known/jwks.json"
      HYDRA_ISSUER: "http://localhost:${KONG_HOST_PORT:-8080}/"
      # Each install step is a call onto the service that owns that part of
      # the bundle, made with the installing admin's own token.
      IDENTITY_SERVICE_URL: "http://identity-service:${IDENTITY_SERVICE_PORT:-4004}"
      SERVICE_SERVICE_URL: "http://service-service:${SERVICE_SERVICE_PORT:-4003}"
      EMAIL_SERVICE_URL: "http://email-service:${EMAIL_SERVICE_PORT:-4006}"
      ENGAGEMENT_SERVICE_URL: "http://engagement-service:${ENGAGEMENT_SERVICE_PORT:-4009}"
      OBLIGATION_SERVICE_URL: "http://obligation-service:${OBLIGATION_SERVICE_PORT:-4010}"
      DOCUMENT_SERVICE_URL: "http://document-service:${DOCUMENT_SERVICE_PORT:-4011}"
      VAULT_SERVICE_URL: "http://vault-service:${VAULT_SERVICE_PORT:-4012}"
      ASSISTANT_SERVICE_URL: "http://assistant-service:${ASSISTANT_SERVICE_PORT:-4007}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${BUNDLE_SERVICE_PORT:-4008}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  engagement-service:
    build:
      context: ./engagement-service
    container_name: customer-management-engagement-service
    ports:
      - "${ENGAGEMENT_SERVICE_HOST_PORT:-4009}:${ENGAGEMENT_SERVICE_PORT:-4009}"
    environment:
      PORT: "${ENGAGEMENT_SERVICE_PORT:-4009}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      # Hydra's RS256 tokens, the only kind accepted: its keys and issuer.
      HYDRA_JWKS_URL: "http://hydra:4444/.well-known/jwks.json"
      HYDRA_ISSUER: "http://localhost:${KONG_HOST_PORT:-8080}/"
      # The installed bundle (types, fields) and email automations.
      BUNDLE_SERVICE_URL: "http://bundle-service:${BUNDLE_SERVICE_PORT:-4008}"
      EMAIL_SERVICE_URL: "http://email-service:${EMAIL_SERVICE_PORT:-4006}"
      OBLIGATION_SERVICE_URL: "http://obligation-service:${OBLIGATION_SERVICE_PORT:-4010}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${ENGAGEMENT_SERVICE_PORT:-4009}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  obligation-service:
    build:
      context: ./obligation-service
    container_name: customer-management-obligation-service
    ports:
      - "${OBLIGATION_SERVICE_HOST_PORT:-4010}:${OBLIGATION_SERVICE_PORT:-4010}"
    environment:
      PORT: "${OBLIGATION_SERVICE_PORT:-4010}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      # Hydra's RS256 tokens, the only kind accepted: its keys and issuer.
      HYDRA_JWKS_URL: "http://hydra:4444/.well-known/jwks.json"
      HYDRA_ISSUER: "http://localhost:${KONG_HOST_PORT:-8080}/"
      BUNDLE_SERVICE_URL: "http://bundle-service:${BUNDLE_SERVICE_PORT:-4008}"
      EMAIL_SERVICE_URL: "http://email-service:${EMAIL_SERVICE_PORT:-4006}"
      # Signs the deadline reminders' narrow service token (no user to forward).
      SERVICE_JWT_SECRET: "${SERVICE_JWT_SECRET:-omnicore-development-service-secret-change-this}"
      OBLIGATION_REMINDER_INTERVAL_MS: "${OBLIGATION_REMINDER_INTERVAL_MS:-3600000}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${OBLIGATION_SERVICE_PORT:-4010}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  document-service:
    build:
      context: ./document-service
    container_name: customer-management-document-service
    ports:
      - "${DOCUMENT_SERVICE_HOST_PORT:-4011}:${DOCUMENT_SERVICE_PORT:-4011}"
    environment:
      PORT: "${DOCUMENT_SERVICE_PORT:-4011}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      # Hydra's RS256 tokens, the only kind accepted: its keys and issuer.
      HYDRA_JWKS_URL: "http://hydra:4444/.well-known/jwks.json"
      HYDRA_ISSUER: "http://localhost:${KONG_HOST_PORT:-8080}/"
      BUNDLE_SERVICE_URL: "http://bundle-service:${BUNDLE_SERVICE_PORT:-4008}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${DOCUMENT_SERVICE_PORT:-4011}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  vault-service:
    build:
      context: ./vault-service
    container_name: customer-management-vault-service
    ports:
      - "${VAULT_SERVICE_HOST_PORT:-4012}:${VAULT_SERVICE_PORT:-4012}"
    environment:
      PORT: "${VAULT_SERVICE_PORT:-4012}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      # Hydra's RS256 tokens, the only kind accepted: its keys and issuer.
      HYDRA_JWKS_URL: "http://hydra:4444/.well-known/jwks.json"
      HYDRA_ISSUER: "http://localhost:${KONG_HOST_PORT:-8080}/"
      # Only this service holds the vault key and the object store's keys.
      # assistant-service blanks all three (it loads .env through env_file).
      VAULT_MASTER_KEY: "${VAULT_MASTER_KEY:-}"
      S3_ENDPOINT: "http://seaweedfs:8333"
      S3_BUCKET: "${S3_BUCKET:-client-files}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-omnicore-dev}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-omnicore-development-s3-secret-change-this}"
      BUNDLE_SERVICE_URL: "http://bundle-service:${BUNDLE_SERVICE_PORT:-4008}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${VAULT_SERVICE_PORT:-4012}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  kong:
    image: kong:3.9
    container_name: customer-management-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      # Kong caches upstream DNS. With its defaults it trusts Docker's 600 s
      # record TTL and then serves a stale answer for another hour, so a
      # recreated container with a new IP got 502s until Kong was restarted.
      KONG_DNS_VALID_TTL: "${KONG_DNS_VALID_TTL:-5}"
      KONG_DNS_STALE_TTL: "${KONG_DNS_STALE_TTL:-0}"
      KONG_DNS_NOT_FOUND_TTL: "${KONG_DNS_NOT_FOUND_TTL:-5}"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      # 8000 is Kong's own proxy port inside the container and is not ours to
      # change; only the host side is configurable.
      - "${KONG_HOST_PORT:-8080}:8000"
    depends_on:
      lead-service:
        condition: service_started
      customer-service:
        condition: service_started
      service-service:
        condition: service_healthy
      identity-service:
        condition: service_started
      assistant-service:
        condition: service_started
      bundle-service:
        condition: service_started
      engagement-service:
        condition: service_started
      obligation-service:
        condition: service_started
      document-service:
        condition: service_started
      vault-service:
        condition: service_started
      hydra:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: customer-management-frontend
    restart: unless-stopped
    environment:
      # Where the browser reaches Kong. Vite substitutes VITE_* at transform
      # time, so the container must be rebuilt (or restarted) for a change here
      # to reach the page — it is not read at request time.
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:${KONG_HOST_PORT:-8080}/api}"

    ports:
      # The container side is fixed: the frontend's own start script pins Vite
      # to 3000.
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      kong:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  seaweedfs_data:
