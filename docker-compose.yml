# Every value here comes from .env. The `:-` defaults are what the MVP has
# always used, so the stack still boots on a fresh clone with no .env at all;
# copy .env.example to .env to take control of any of them.
#
# Two things do NOT come from interpolation, deliberately:
#
#   - The OpenRouter settings, which assistant-service reads through env_file.
#     `${VAR}` interpolation prefers a shell export over .env, which is exactly
#     what we were asked to stop.
#   - The internal service ports are also written into kong/kong.yml, which is a
#     separate submodule and is not templated. Changing a *_SERVICE_PORT here
#     means editing kong.yml to match, or the gateway will route to a dead port.

services:
  postgres:
    image: postgres:16-alpine
    container_name: customer-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:-customer_management}"
      POSTGRES_USER: "${DB_USER:-app_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-app_password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-customer_management}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: customer-management-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  migrate:
    build:
      context: ./migrations
    container_name: customer-management-migrate
    # Must not inherit a restart policy: this container is expected to exit 0.
    restart: "no"
    environment:
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      BOOTSTRAP_ORG_NAME: "${BOOTSTRAP_ORG_NAME:-Acme Corporation}"
      BOOTSTRAP_ORG_SLUG: "${BOOTSTRAP_ORG_SLUG:-acme-corporation}"
      BOOTSTRAP_ADMIN_NAME: "${BOOTSTRAP_ADMIN_NAME:-Admin}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-admin@acme.example}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
    depends_on:
      postgres:
        condition: service_healthy

  service-service:
    build:
      context: ./service-service
    container_name: customer-management-service-service
    ports:
      - "${SERVICE_SERVICE_HOST_PORT:-4003}:${SERVICE_SERVICE_PORT:-4003}"
    environment:
      PORT: "${SERVICE_SERVICE_PORT:-4003}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      JWT_SECRET: "${JWT_SECRET:-omnicore-development-secret-change-this}"
      JWT_ISSUER: "${JWT_ISSUER:-omnicore-identity-service}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${SERVICE_SERVICE_PORT:-4003}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  customer-service:
    build:
      context: ./customer-service
    container_name: customer-management-customer-service
    ports:
      - "${CUSTOMER_SERVICE_HOST_PORT:-4002}:${CUSTOMER_SERVICE_PORT:-4002}"
    environment:
      PORT: "${CUSTOMER_SERVICE_PORT:-4002}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      JWT_SECRET: "${JWT_SECRET:-omnicore-development-secret-change-this}"
      JWT_ISSUER: "${JWT_ISSUER:-omnicore-identity-service}"
      SERVICE_SERVICE_URL: "http://service-service:${SERVICE_SERVICE_PORT:-4003}"
      EMAIL_SERVICE_URL: "http://email-service:${EMAIL_SERVICE_PORT:-4006}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      service-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${CUSTOMER_SERVICE_PORT:-4002}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  lead-service:
    build:
      context: ./lead-service
    container_name: customer-management-lead-service
    ports:
      - "${LEAD_SERVICE_HOST_PORT:-4001}:${LEAD_SERVICE_PORT:-4001}"
    environment:
      PORT: "${LEAD_SERVICE_PORT:-4001}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      JWT_SECRET: "${JWT_SECRET:-omnicore-development-secret-change-this}"
      JWT_ISSUER: "${JWT_ISSUER:-omnicore-identity-service}"
      CUSTOMER_SERVICE_URL: "http://customer-service:${CUSTOMER_SERVICE_PORT:-4002}"
      SERVICE_SERVICE_URL: "http://service-service:${SERVICE_SERVICE_PORT:-4003}"
      EMAIL_SERVICE_URL: "http://email-service:${EMAIL_SERVICE_PORT:-4006}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      service-service:
        condition: service_healthy
      customer-service:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${LEAD_SERVICE_PORT:-4001}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  identity-service:
    build:
      context: ./identity-service
    container_name: customer-management-identity-service
    ports:
      - "${IDENTITY_SERVICE_HOST_PORT:-4004}:${IDENTITY_SERVICE_PORT:-4004}"
    environment:
      PORT: "${IDENTITY_SERVICE_PORT:-4004}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"
      JWT_SECRET: "${JWT_SECRET:-omnicore-development-secret-change-this}"
      JWT_ISSUER: "${JWT_ISSUER:-omnicore-identity-service}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-8h}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${IDENTITY_SERVICE_PORT:-4004}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  dashboard-service:
    build:
      context: ./dashboard-service
    container_name: customer-management-dashboard-service
    ports:
      - "${DASHBOARD_SERVICE_HOST_PORT:-4005}:${DASHBOARD_SERVICE_PORT:-4005}"
    environment:
      PORT: "${DASHBOARD_SERVICE_PORT:-4005}"

      # Needed only to read active access grants when authenticating a request.
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"

      JWT_SECRET: "${JWT_SECRET:-omnicore-development-secret-change-this}"
      JWT_ISSUER: "${JWT_ISSUER:-omnicore-identity-service}"

      LEAD_SERVICE_URL: "http://lead-service:${LEAD_SERVICE_PORT:-4001}"
      CUSTOMER_SERVICE_URL: "http://customer-service:${CUSTOMER_SERVICE_PORT:-4002}"
      SERVICE_SERVICE_URL: "http://service-service:${SERVICE_SERVICE_PORT:-4003}"

      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lead-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      service-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${DASHBOARD_SERVICE_PORT:-4005}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  email-service:
    build:
      context: ./email-service
    container_name: customer-management-email-service
    restart: unless-stopped

    ports:
      - "${EMAIL_SERVICE_HOST_PORT:-4006}:${EMAIL_SERVICE_PORT:-4006}"

    environment:
      PORT: "${EMAIL_SERVICE_PORT:-4006}"

      # PostgreSQL
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"

      # JWT
      JWT_SECRET: "${JWT_SECRET:-omnicore-development-secret-change-this}"
      JWT_ISSUER: "${JWT_ISSUER:-omnicore-identity-service}"

      # Redis
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"

      CUSTOMER_SERVICE_URL: "http://customer-service:${CUSTOMER_SERVICE_PORT:-4002}"
      LEAD_SERVICE_URL: "http://lead-service:${LEAD_SERVICE_PORT:-4001}"

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${EMAIL_SERVICE_PORT:-4006}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  assistant-service:
    build:
      context: ./assistant-service
    container_name: customer-management-assistant-service
    restart: unless-stopped

    ports:
      - "${ASSISTANT_SERVICE_HOST_PORT:-4007}:${ASSISTANT_SERVICE_PORT:-4007}"

    # The OpenRouter settings come from .env and ONLY from .env.
    #
    # They are not listed under `environment:` below, because `${VAR}`
    # interpolation prefers a value exported in the shell, which silently beat
    # the file and left the real source of the key ambiguous. env_file is read
    # straight off disk and never consults the shell.
    #
    # env_file loads the whole file, so everything else .env defines also lands
    # in this container. The bootstrap values are blanked below for that reason.
    env_file:
      - path: .env
        required: false

    environment:
      PORT: "${ASSISTANT_SERVICE_PORT:-4007}"

      # Only used to read active just-in-time grants when authenticating.
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-customer_management}"
      DB_USER: "${DB_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:-app_password}"

      JWT_SECRET: "${JWT_SECRET:-omnicore-development-secret-change-this}"
      JWT_ISSUER: "${JWT_ISSUER:-omnicore-identity-service}"

      # Every tool is a call onto one of these, made with the signed-in user's
      # own token, so each service applies its usual permission checks.
      LEAD_SERVICE_URL: "http://lead-service:${LEAD_SERVICE_PORT:-4001}"
      CUSTOMER_SERVICE_URL: "http://customer-service:${CUSTOMER_SERVICE_PORT:-4002}"
      SERVICE_SERVICE_URL: "http://service-service:${SERVICE_SERVICE_PORT:-4003}"
      DASHBOARD_SERVICE_URL: "http://dashboard-service:${DASHBOARD_SERVICE_PORT:-4005}"
      EMAIL_SERVICE_URL: "http://email-service:${EMAIL_SERVICE_PORT:-4006}"

      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-http://localhost:3000}"

      # `environment:` overrides env_file, so these blank out the seed
      # credentials this service has no use for. Without them, the one service
      # that talks to an external model would also be holding the bootstrap
      # admin password in its environment.
      BOOTSTRAP_ADMIN_PASSWORD: ""
      BOOTSTRAP_ADMIN_EMAIL: ""
      BOOTSTRAP_ADMIN_NAME: ""
      BOOTSTRAP_ORG_NAME: ""
      BOOTSTRAP_ORG_SLUG: ""

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      lead-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${ASSISTANT_SERVICE_PORT:-4007}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kong:
    image: kong:3.9
    container_name: customer-management-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      # 8000 is Kong's own proxy port inside the container and is not ours to
      # change; only the host side is configurable.
      - "${KONG_HOST_PORT:-8080}:8000"
    depends_on:
      lead-service:
        condition: service_started
      customer-service:
        condition: service_started
      service-service:
        condition: service_healthy
      identity-service:
        condition: service_started
      assistant-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: customer-management-frontend
    restart: unless-stopped
    environment:
      # Where the browser reaches Kong. Vite substitutes VITE_* at transform
      # time, so the container must be rebuilt (or restarted) for a change here
      # to reach the page — it is not read at request time.
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:${KONG_HOST_PORT:-8080}/api}"

    ports:
      # The container side is fixed: the frontend's own start script pins Vite
      # to 3000.
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      kong:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
